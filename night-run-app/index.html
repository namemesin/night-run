/* Layout: one full-height stage, HUD strip on top, canvas fills the rest. Single dark look: a ski slope under an aurora. */
:root {

.toggles { display: flex; gap: 6px; }
.mute {
  font-family: var(--mono); font-size: .68rem; letter-spacing: .06em; text-transform: uppercase;

.mute[aria-pressed="true"] { color: var(--snow); border-color: #33476b; }

<body>

<div class="hud">
  <h1>Night Run</h1>
  <div class="stats">
    <div><span>Score</span><b id="score">0</b></div>
    <div><span>Best</span><b id="best">0</b></div>
    <div class="toggles">

      <button class="mute" id="sfxBtn" type="button" aria-pressed="true">Sound</button>
      <button class="mute" id="setBtn" type="button" aria-label="Settings">Settings</button>
    </div>
  </div>
</div>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <button class="pause" id="pauseBtn" type="button" aria-label="Pause" hidden>II</button>
  <button class="boost" id="boost" type="button" hidden>Flare</button>
  <div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>
</div>

<script>
(() => {
  'use strict';
  /* ===== LEADERBOARD SETUP =====
     To share scores on your own website, paste your Supabase Project URL and publishable key between the quotes.
     Example: const SUPABASE_URL = 'https://abcdefgh.supabase.co';
     Leave them empty to keep scores on each player's device. Never paste the secret (service_role) key here. */
  const SUPABASE_URL = 'https://bpspwjzxglazmonacbtr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_PCt45qNSdR6dPRehXvr4KQ_YeLWpE9Q';

  // Links only make sense when the game is the top-level page (your own site), not inside a frame.
  const TOP_LEVEL = window.self === window.top && /^https?:$/.test(location.protocol);
  const SHARE_URL = TOP_LEVEL ? location.origin + location.pathname : '';
  const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const STANDALONE = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  const PHONE = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
  const fog = document.createElement('canvas'), fctx = fog.getContext('2d');
  const stage = $('stage'), scoreEl = $('score'), bestEl = $('best'), overlay = $('overlay'), panel = $('panel');
  const boostBtn = $('boost'), pauseBtn = $('pauseBtn'), musicBtn = $('musicBtn'), sfxBtn = $('sfxBtn');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = n => Math.floor(n).toLocaleString('en-US');

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = stage.clientWidth || 360; H = stage.clientHeight || 600;
    cv.width = fog.width = Math.round(W * dpr); cv.height = fog.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  /* ================= save data ================= */
  const DEF_UP = { flare: 0, magnet: 0, combo: 0, shield: 0, soft: 0, lucky: 0, grind: 0 };
  let save = { best: 0, top: [], done: [], board: 0, muted: false, music: true, coins: 0, up: Object.assign({}, DEF_UP), bought: false };
  try {
    const raw = localStorage.getItem('nightrun-save3');
    if (raw) { const p = JSON.parse(raw); save = Object.assign(save, p); save.up = Object.assign({}, DEF_UP, p.up || {}); }
    else save.best = +localStorage.getItem('nightrun-best2') || 0;
  } catch (e) {}
  if (!Array.isArray(save.top)) save.top = [];
  if (!Array.isArray(save.done)) save.done = [];
  if (!save.bs || typeof save.bs !== 'object') save.bs = {};
  const LIFE_KEYS = ['runs', 'meters', 'flakes', 'lanterns', 'tricks', 'rails', 'gates', 'nearMiss', 'smashes', 'score', 'airs', 'saves', 'flares', 'shields', 'magnets', 'doubles', 'crashes', 'secs', 'ghostPasses', 'bcVisits', 'dailyDays', 'dailyStreak', 'spent', 'challenges', 'summitVisits', 'leaps', 'missions', 'sweeps', 'races', 'raceWins', 'ghostWins'];
  { const l = save.life && typeof save.life === 'object' ? save.life : {}; save.life = {}; for (const k of LIFE_KEYS) save.life[k] = Math.max(0, Math.floor(+l[k] || 0)); }
  if (!Array.isArray(save.skins)) save.skins = [];
  if (typeof save.skin !== 'string') save.skin = 'classic';
  // When the skin and board were last picked, so the newest pick wins when devices sync.
  if (!save.picked || typeof save.picked !== 'object') save.picked = {};
  save.picked = ['skin', 'board', 'color', 'title', 'trail', 'crash'].reduce((o, k) => (o[k] = Math.max(0, +save.picked[k] || 0), o), {});
  if (!Array.isArray(save.boardsOwned)) save.boardsOwned = [];
  if (!save.v || save.v < 2) {
    const oldR = [0, 3, 6, 9, 12, 15, 19, 24, 28], n = new Set(save.done).size;
    oldR.forEach((r, i) => { if (n >= r && !save.boardsOwned.includes(i)) save.boardsOwned.push(i); });
    save.v = 2;
  }
  if (save.mode !== 'daily') save.mode = 'free';
  if (typeof save.music !== 'boolean') save.music = true;
  // Device settings (not synced to the account): volumes, key bindings, and comfort options.
  const DEF_KEYS = { left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'], flare: ['Space', 'ShiftLeft'], pause: ['KeyP', 'Escape'], restart: ['KeyR', ''] };
  const KEY_ACTIONS = [['left', 'Steer left'], ['right', 'Steer right'], ['flare', 'Fire Flare'], ['pause', 'Pause'], ['restart', 'Restart run']];
  const defSettings = () => ({ music: 80, sfx: 80, shake: true, ghost: true, fx: 'full', stats: true, steer: 'drag', keys: JSON.parse(JSON.stringify(DEF_KEYS)) });
  (() => {
    const d = defSettings(), st = save.settings && typeof save.settings === 'object' ? save.settings : {};
    const vol = v => Number.isFinite(+v) ? Math.max(0, Math.min(100, Math.round(+v))) : null;
    d.music = vol(st.music) ?? d.music; d.sfx = vol(st.sfx) ?? d.sfx;
    if (typeof st.shake === 'boolean') d.shake = st.shake;
    if (typeof st.ghost === 'boolean') d.ghost = st.ghost;
    if (typeof st.stats === 'boolean') d.stats = st.stats;
    if (st.steer === 'sides') d.steer = 'sides';
    if (st.fx === 'low') d.fx = 'low';
    if (st.keys && typeof st.keys === 'object') for (const [a] of KEY_ACTIONS) {
      const k = st.keys[a];
      if (Array.isArray(k)) d.keys[a] = [0, 1].map(i => typeof k[i] === 'string' ? k[i].slice(0, 24) : '');
    }
    save.settings = d;
  })();
  // A random id for this device, so player data can tell riders apart without knowing who anyone is.
  if (typeof save.dev !== 'string' || !/^[a-z0-9]{8,40}$/.test(save.dev)) save.dev = 'd' + Array.from({ length: 15 }, () => Math.floor(Math.random() * 36).toString(36)).join('');
  // Flakes, XP and bought boosts are each kept as a ledger: what each copy of the progress has added and taken away.
  // Merging two devices takes the higher number for each entry, so a purchase on one device can't be undone by
  // another device's older copy, and flakes earned on two devices at once both count.
  const cleanCounts = o => { const r = {}; if (o && typeof o === 'object') for (const k in o) if (/^[a-z0-9]{8,40}$/.test(k)) { const v = Math.floor(+o[k]); if (v > 0) r[k] = v; } return r; };
  const sumCounts = o => Object.values(o).reduce((n, v) => n + v, 0);
  const pnClean = L => L && typeof L === 'object' ? { base: Math.max(0, Math.floor(+L.base || 0)), e: cleanCounts(L.e), s: cleanCounts(L.s) } : { base: 0, e: {}, s: {} };
  const pnRaw = L => L.base + sumCounts(L.e) - sumCounts(L.s);
  const pnVal = L => Math.max(0, pnRaw(L));
  function pnMerge(L, R) {
    R = pnClean(R); L.base = Math.max(L.base, R.base);
    for (const k in R.e) L.e[k] = Math.max(L.e[k] || 0, R.e[k]);
    for (const k in R.s) L.s[k] = Math.max(L.s[k] || 0, R.s[k]);
  }
  // Two devices spending the same flakes at once (or an admin taking more than you have) can push a total below zero.
  // That debt is forgiven, so the next flakes you earn show up instead of filling the hole.
  function pnHeal(L) { const r = pnRaw(L); if (r < 0) L.base -= r; }
  // Entries an admin added or took live under this key. Every other key belongs to one copy of the progress.
  const ADM = 'zadmin00';
  // The key this copy of the progress books under. It changes after every log out, so a guest's earnings on
  // this device can never be confused with an account's older entries from the same device.
  const newKey = () => 'k' + Array.from({ length: 15 }, () => Math.floor(Math.random() * 36).toString(36)).join('');
  if (typeof save.lk !== 'string' || !/^[a-y0-9][a-z0-9]{7,39}$/.test(save.lk)) save.lk = save.dev;
  save.ledger = save.ledger && typeof save.ledger === 'object' ? pnClean(save.ledger) : { base: Math.max(0, Math.floor(+save.coins || 0)), e: {}, s: {} };
  const ledgerCoins = () => pnVal(save.ledger);
  save.coins = ledgerCoins();
  let coinMark = save.coins;
  // Books any change to save.coins since the last save as earned or spent by this copy.
  function settleCoins() {
    const d = Math.floor(+save.coins || 0) - coinMark, L = save.ledger;
    if (d > 0) L.e[save.lk] = (L.e[save.lk] || 0) + d;
    else if (d < 0) L.s[save.lk] = (L.s[save.lk] || 0) - d;
    save.coins = coinMark = ledgerCoins();
  }

  /* ================= loop ================= */
  let loopId = 0;
  function kickLoop() {
    const id = ++loopId;
    const step = now => {
      if (id !== loopId || (state !== 'run' && state !== 'crash')) return;
      const dt = Math.min((now - last) / 16.67, 3); last = now;
      if (freeze > 0) freeze -= dt; else update(dt, now);
      draw(now);
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function update(dt, now) {
    shake = Math.max(0, shake - dt * 0.8);
    flash = Math.max(0, flash - dt * 0.04);
    punch = Math.max(0, punch - dt * 0.05);
    const pdt = state === 'crash' ? dt * .5 : dt;
    for (const p of parts) { p.x += p.vx * pdt; p.y += p.vy * pdt - (state === 'run' ? speed * pdt * .5 : 0); p.vx *= .96; p.vy *= .96; p.life -= pdt; }
    parts = parts.filter(p => p.life > 0);
    for (const t of texts) { t.y -= 1.1 * dt; t.life -= dt; }
    texts = texts.filter(t => t.life > 0);
    if (toasts.length) { toasts[0].life -= dt; toasts = toasts.filter(t => t.life > 0); }

    if (pops.length) {
      for (const p of pops) { p.t -= dt; if (p.t <= 0) { burst(p.x, p.y, 34, p.c, 6, 55, 3); tone(500 + Math.random() * 500, .15, 'triangle', .04); } }
      pops = pops.filter(p => p.t > 0);
    }
    if (state === 'crash') { crashT -= dt; if (crashT <= 0) end(); return; }

    const boosting = flareT > 0, inAir = player.air > 0;
    flareT = Math.max(0, flareT - dt); inv = Math.max(0, inv - dt);
    if (!player.shield && player.spares > 0 && inv <= 0) { player.shield = true; player.spares--; float(player.x, player.y - 30, 'EXTRA SHIELD', '#8fd3ff'); tone(520, .2, 'sine', .05, 400); }
    magnetT = Math.max(0, magnetT - dt); dblT = Math.max(0, dblT - dt);
    if (!boosting && lanternsHeld === 3) boostBtn.hidden = false;
    // same pace as always for the first 800 m, then it builds a bit more gradually

    dist += speed * dt * 0.1;
    addScore(speed * dt * 0.1 * (1 + combo * 0.1));
    run.meters = Math.floor(dist - startDist);

    if (!run.grounded && run.score >= 5000 && !run.airs && !run.rails && player.air <= 0) run.grounded = 1;

    // ghost: record this run, replay the best one (1 m of distance = 10 px on screen)

    if (gh.on) {

        gh.x = (x0 + (x1 - x0) * k) / 1000 * W; gh.d = (ghost.r[i * 2 + 1] + (ghost.r[i * 2 + 3] - ghost.r[i * 2 + 1]) * k) / 10;
      } else { gh.done = true; gh.x = ghost.r[(n - 1) * 2] / 1000 * W; gh.d = ghost.r[(n - 1) * 2 + 1] / 10; }
      if (gh.done && !gh.passed && dist > gh.d) {
        gh.passed = true;
        if (gh.name) toast(`PASSED ${gh.name.toUpperCase()}'S GHOST`, '#7fe8ff', 130);
        else { run.passedGhost = 1; toast('PASSED YOUR BEST RUN', '#b48cff', 130); }
        tone(660, .12, 'triangle', .05); tone(880, .12, 'triangle', .05, 0, .1); tone(1320, .3, 'triangle', .05, 0, .2);
      }
    }

    const nz = ZONES.reduce((a, z, i) => dist >= z.at ? i : a, 0);
    if (nz !== zoneIdx) {
      zoneIdx = nz; run.zone = nz; bannerT = 140;
      if (nz >= 3 && !run.shields && !run.saves && !save.up.shield) run.noShield = 1;
      if (nz >= 4 && !run.flaresFired) run.purist = 1;
      tone(392, .15, 'triangle', .06); tone(587, .25, 'triangle', .06, 0, .12);
      if (nz === 4) toast('LIGHTS OUT. FOLLOW THE LANTERNS.', '#ffb347', 180);
      if (nz === 5) toast('SUMMIT. JUMP OR DODGE THE CREVASSES.', '#cdb4ff', 200);
    }
    bannerT = Math.max(0, bannerT - dt);
    darkA += ((zoneIdx === 4 ? .9 : 0) - darkA) * Math.min(1, .015 * dt);
    summitA += ((zoneIdx >= 5 ? 1 : 0) - summitA) * Math.min(1, .01 * dt);


    // steering, grinding, air
    const dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0) || touchDir;
    if (player.grind) {
      const r = player.grind;
      player.x += (r.x - player.x) * Math.min(1, .4 * dt); player.vx = 0;
      const g = .5 * speed * dt * (1 + .25 * (save.up.grind || 0)); grindPts += g; addScore(g);
      if (Math.random() < .9 * dt) parts.push({ x: player.x + (Math.random() - .5) * 8, y: player.y + 8, vx: (Math.random() - .5) * 3, vy: -Math.random() * 2.5, life: 18, max: 18, c: Math.random() < .5 ? '#ffd24a' : '#ffffff', s: Math.random() * 2 + 1 });
      if (r.y + r.len < player.y - 2) endGrind();
    } else if (inAir) {
      player.spin += dir * 0.19 * dt;
      if (!dir && touchUsed) { const a = ((player.spin % TAU) + TAU) % TAU, toward = a < Math.PI ? -a : TAU - a; player.spin += toward * Math.min(1, .09 * dt); }

    } else {

    }
    player.x += player.vx * dt;
    if (player.x < 10 || player.x > W - 10) { player.x = Math.max(10, Math.min(W - 10, player.x)); player.vx *= -0.4; }
    player.tilt += (player.vx * 0.07 - player.tilt) * Math.min(1, 0.3 * dt);

    const grounded = player.air <= 0 && !player.grind;
    if (grounded && Math.abs(player.vx) > 3 && Math.random() < 0.6 * dt) {

    }
    if (skinById(save.skin).extra === 'flames' && !reduce && Math.random() < .7 * dt) {
      parts.push({ x: player.x + (Math.random() - .5) * 8, y: player.y - 10, vx: (Math.random() - .5) * .8, vy: -1 - Math.random() * 1.5, life: 18, max: 18, c: Math.random() < .5 ? '#ff4b2b' : '#ffb347', s: Math.random() * 3 + 1.5 });
    }
    if (boosting && Math.random() < 0.8 * dt) {
      parts.push({ x: player.x + (Math.random() - .5) * 10, y: player.y - 4, vx: (Math.random() - .5) * 1.5, vy: -Math.random() * 2, life: 26, max: 26, c: Math.random() < .5 ? '#ffb347' : '#ff7a3d', s: Math.random() * 3 + 1 });
    }

    const board = BOARDS[save.board] || BOARDS[0];
    const tr = flexItem('trail', save.style.trail) || TRAILS[0], plain = tr.id === 'classic';
    const tc = boosting ? '#ff9640' : plain ? (combo >= 5 ? boardFill(board, now) : tr.c) : tr.c === 'rainbow' ? `hsl(${(now / 5) % 360},90%,65%)` : tr.c;
    trail.push({ x: player.x, y: player.y + 8, gap: !grounded, c: tc, a: boosting || (plain && combo >= 5) ? .6 : tr.a, w: tr.w });
    if (grounded && !reduce && save.settings.fx !== 'low') {
      if (tr.spark && Math.random() < .45 * dt) parts.push({ x: player.x + (Math.random() - .5) * 10, y: player.y + 8, vx: (Math.random() - .5) * .6, vy: Math.random() * .6, life: 30, max: 30, c: tr.spark, s: Math.random() * 1.8 + .6 });
      if (tr.fire && Math.random() < .6 * dt) parts.push({ x: player.x + (Math.random() - .5) * 8, y: player.y + 9, vx: (Math.random() - .5) * .8, vy: -.4 - Math.random(), life: 20, max: 20, c: Math.random() < .5 ? '#ff4b2b' : '#ffb347', s: Math.random() * 2.5 + 1 });
    }
    for (const t of trail) t.y -= speed * dt;
    while (trail.length && trail[0].y < -10) trail.shift();

    if (combo > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }

    // spawning
    spawnT -= dt; patternCd -= dt; reserveT -= dt;
    if (spawnT <= 0) {

      else {

      if (o.hit) continue;
      const k = o.kind;
      if (magR && (k === 'coin' || k === 'lantern')) {

            tone(700 + Math.min(gateChain, 12) * 50, .1, 'triangle', .05);
          } else if (gateChain > 0) { gateChain = 0; float(o.x, o.y - 10, 'MISSED GATE', '#7b8ca6'); }
        }

          else if (player.shield) { useShield(); o.saved = true; float(player.x, player.y - 30, 'CAUGHT THE EDGE', '#8fd3ff'); }
          else { cause = 'crevasse'; crash(); return; }
        }
        if (!o.passed && o.y + o.h / 2 < player.y) {

          if (airNow && ax < o.w / 2 && !o.saved) {

            float(o.x, o.y - 12, run.leaps > 1 ? `LEAP x${run.leaps} +100` : 'LEAP +100', '#cdb4ff', true);
            tone(988, .1, 'triangle', .05); tone(1480, .2, 'triangle', .05, 0, .08);

          burst(o.x, o.y, 22, k === 'tree' ? ['#2f6b55', '#e8eef7', '#3a2a1e'] : k === 'skier' ? ['#ff4466', '#e8eef7'] : ['#56657c', '#e8eef7'], 6, 35, 3);

    obs = obs.filter(o => o.y + (o.len || 0) > -70 && !(o.hit && o.kind !== 'ramp'));

    moveAmbient(dt);
    scoreEl.textContent = fmt(run.score);
    checkAch(run);
    missionTick(run, false);
    if (runMode === 'race' && race && race.ch) raceSend(dir, false);
  }

  function moveAmbient(dt) {
    if (reduce) return;
    const drift = .0004;

  }

  // attract mode behind the menus

    if (idleOn) return;

      if (state !== 'menu' && state !== 'over') { idleOn = false; return; }
      const dt = Math.min((now - lt) / 16.67, 3); lt = now; it += dt;

    if (achT) drawAchCard(achT);
    toasts.filter(tt => tt.kind !== 'ach').slice(0, 2).forEach((tt, i) => {
      ctx.globalAlpha = i === 0 && !achT ? Math.min(1, tt.life / 25) : .55;
      ctx.font = Math.round(Math.min(12, W / 34)) + 'px "Bungee", Impact, sans-serif'; ctx.textAlign = 'center';
      const w = Math.min(W - 24, ctx.measureText(tt.text).width + 24), y = H - 74 - i * 32;
      ctx.fillStyle = 'rgba(10,16,32,.88)'; rr(ctx, W / 2 - w / 2, y - 17, w, 25, 4); ctx.fill();
      ctx.strokeStyle = tt.c; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = tt.c; ctx.fillText(tt.text, W / 2, y);
      ctx.globalAlpha = 1;
    });
  }

  /* ================= boot ================= */
  addEventListener('resize', () => { resize(); if (state !== 'run') draw(performance.now()); });
  resize(); reset(); bannerT = 0;
  for (let i = 0; i < 10; i++) { const r = Math.random(); const o = add(r < .6 ? 'tree' : r < .8 ? 'rock' : 'coin', 20 + Math.random() * (W - 40)); o.y = H * (0.35 + Math.random() * 0.65); }
  if (location.hash === '#daily') save.mode = 'daily';
  setTimeout(checkForUpdate, 4000);
  setInterval(() => { if (!document.hidden) checkForUpdate(); }, 5 * 60 * 1000);
  addEventListener('online', () => checkForUpdate());
  // New achievements your past bests already earned unlock right away.
  checkAch(Object.assign(blankStats(), save.bs), true); newDone = [];
  renderPanel();
  draw(performance.now());
  idleStart();
})();
</script>

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => { if (window.nrLogError) window.nrLogError('E500', e); }));
}
</script>

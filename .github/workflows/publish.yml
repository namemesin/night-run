name: Publish Night Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version number comes from the commit history
      - name: Unpack the game
        run: |
          zip="night-run-app.zip"
          [ -f "$zip" ] || zip="$(ls -t *.zip | head -n 1)"
          echo "Publishing $zip"
          mkdir site
          unzip -q -o "$zip" -d site
          # a zip that holds a single folder: use what's inside it
          if [ ! -f site/index.html ] && [ "$(ls site | wc -l)" = "1" ]; then mv site/*/* site/; fi
          test -f site/index.html
          sed -i 's#https://night-run-drop-in.netlify.app/#https://namemesin.github.io/night-run/#g' site/index.html
      - name: Set the version number
        run: |
          # The first number is in VERSION_MAJOR. The second counts the zips uploaded since that file last changed.
          major="$(tr -d '[:space:]' < VERSION_MAJOR)"
          minor="$(git rev-list --count "$(git rev-list -1 HEAD -- VERSION_MAJOR)..HEAD" -- '*.zip')"
          version="$major.$minor"
          sed -i -E "s/(APP_VERSION = ')[^']*'/\1$version'/" site/index.html
          sed -i -E "s/(const CACHE = 'night-run-)[^']*'/\1$version'/; s/(offline support, version ).*/\1$version./" site/sw.js
          printf '{"version": "%s"}\n' "$version" > site/version.json
          grep -q "APP_VERSION = '$version'" site/index.html
          grep -q "const CACHE = 'night-run-$version'" site/sw.js
          echo "Publishing version $version"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
